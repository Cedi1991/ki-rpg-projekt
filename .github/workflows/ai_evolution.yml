name: Autonome KI-Evolutionsschleife

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  evolve-code:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Repository herunterladen
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Python 3.12 einrichten
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Abhängigkeiten installieren
        run: |
          python -m pip install --upgrade pip
          pip install openai pytest pydantic

      - name: Git-Identität für den KI-Bot setzen
        run: |
          git config --global user.name "AI Evolution Bot"
          git config --global user.email "actions@github.com"

      - name: Orchestrator ausführen (1 Feature planen, coden & testen)
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: |
          python orchestrator.py

      - name: Neue Features zurück zu GitHub pushen
        run: |
          git pull origin main --rebase || echo "Rebase übersprungen"
          if [ "$(git rev-parse HEAD)" != "$(git rev-parse origin/main)" ]; then
            git push origin main
          else
            echo "Kein neuer Commit zum Pushen."
          fi
