Name: Autonome KI-Evolutionsschleife

An:
  Zeitplan:
    - Cron: '* * * * *'
  Workflow-Versand:

Berechtigungen:
  Inhalt: schreiben

Gleichzeitigkeit:
  Gruppe: KI-Evolutionsgruppe
  laufende Stornierung: FALSCH

Jobs:
  evolve-code:
    Läuft an: ubuntu-latest
    Zeitüberschreitungminuten: 10

    Schritte:
      - Name: 📦 Repository herunterladen
        Verwendung: Aktionen/Checkout@v4
        mit:
          Abruftiefe: 0

      - Name: 🐍 Python 3.12 einrichten
        Verwendung: Aktionen/Setup-Python@v5
        mit:
          python-version: "3.12"

      - Name: 📦 Abhängigkeiten installieren
        laufen: |
          python -m pip install --upgrade pip
          pip install openai pytest pydantic

      - Name: 🤖 Git-Identität für den KI-Bot setzen
        laufen: |
          git config user.name "AI Evolution Bot"
          git config user.email "actions@github.com"

      - Name: 🚀 Orchestrator ausführen (1 Feature planen, coden & testen)
        Umgebung:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        laufen: |
          python orchestrator.py

      - Name: 📦 Neue Features zurück zu GitHub pushen
        laufen: |
          if [ "$(git rev-parse HEAD)" != "$(git rev-parse origin/main)" ]; then
            echo „Neues Feature erfolgreich getestet! Pushe zu GitHub.“
            git push origin HEAD:main
          anders
            echo „Kein neuer Commit (Tests fehlgeschlagen & Rollback ausgeführt).“
          fi
