<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>KI-3D-RPG | Isometric Dark Fantasy</title>
    <style>
        body {
            background-color: #020408;
            color: #c9d1d9;
            font-family: 'Courier New', Courier, monospace;
            text-align: center;
            padding: 6px;
            margin: 0;
            overflow: hidden;
            touch-action: none;
        }
        .container {
            max-width: 700px;
            margin: 0 auto;
            border: 1px solid #21262d;
            padding: 8px;
            border-radius: 12px;
            background-color: #0d1117;
            box-shadow: 0 20px 40px rgba(0,0,0,0.95);
        }
        h1 {
            color: #58a6ff;
            font-size: 1.15rem;
            margin: 2px 0 4px 0;
            text-shadow: 0 0 12px rgba(88,166,255,0.6);
        }
        .ai-status {
            font-size: 0.7rem;
            color: #3fb950;
            background: #161b22;
            padding: 4px 6px;
            border-radius: 6px;
            border: 1px solid #30363d;
            margin-bottom: 4px;
            text-align: left;
            line-height: 1.25;
        }
        #webgl-container {
            width: 100%;
            height: 330px;
            border-radius: 8px;
            border: 1px solid #30363d;
            margin: 4px 0;
            background: #04060b;
            position: relative;
            cursor: pointer;
            box-shadow: inset 0 0 30px rgba(0,0,0,0.9);
        }
        .stats-box {
            display: flex;
            justify-content: space-around;
            background: #161b22;
            padding: 5px;
            border-radius: 6px;
            margin: 4px 0;
            border: 1px solid #30363d;
            font-weight: bold;
            font-size: 0.8rem;
        }
        .console {
            background: #000205;
            color: #3fb950;
            border: 1px solid #30363d;
            padding: 5px;
            height: 45px;
            overflow-y: auto;
            text-align: left;
            font-size: 0.68rem;
            border-radius: 6px;
        }
    </style>
    <!-- Three.js CDN -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>

    <div class="container">
        <h1>⚔️ KI-3D-RPG: Isometric Dark Engine</h1>
        <div class="ai-status" id="aiStatus">🤖 Lade Backend-Welt-Zustand...</div>
        
        <!-- Isometrisches WebGL Viewport -->
        <div id="webgl-container"></div>

        <div class="stats-box">
            <div>❤️ HP: <span id="hp">100</span></div>
            <div>🪙 Gold: <span id="gold">0</span></div>
            <div>⭐ XP: <span id="xp">0</span></div>
        </div>

        <div class="console" id="console">
            [System] Isometrische Diablo-Perspektive & Backend-Objekte geladen.<br>
        </div>
    </div>

    <script>
        let scene, camera, renderer, playerGroup;
        let interactiveObjects = [];
        let stats = { hp: 100, gold: 0, xp: 0 };
        let targetPosition = null;
        const raycaster = new THREE.Raycaster();
        const mouse = new THREE.Vector2();

        // --- 1. SETUP DER ISOMETRISCHEN 3D-WELT ---
        const container = document.getElementById('webgl-container');
        scene = new THREE.Scene();
        scene.background = new THREE.Color(0x04060b);
        scene.fog = new THREE.FogExp2(0x04060b, 0.04);

        // EXAKTE ISOMETRISCHE KAMERA
        const aspect = container.clientWidth / container.clientHeight;
        const d = 7;
        camera = new THREE.OrthographicCamera(-d * aspect, d * aspect, d, -d, 0.1, 1000);
        camera.position.set(12, 14, 12);
        camera.lookAt(0, 0, 0);

        renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: "high-performance" });
        renderer.setSize(container.clientWidth, container.clientHeight);
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;
        renderer.toneMapping = THREE.ACESFilmicToneMapping;
        renderer.toneMappingExposure = 1.3;
        container.appendChild(renderer.domElement);

        // Beleuchtung
        scene.add(new THREE.AmbientLight(0x1e293b, 2.0));
        
        const mainLight = new THREE.DirectionalLight(0x58a6ff, 2.5);
        mainLight.position.set(10, 20, 10);
        mainLight.castShadow = true;
        scene.add(mainLight);

        // --- 2. DUNGEON BODEN & MAGISCHE RUNEN-GITTER ---
        const floorGeo = new THREE.PlaneGeometry(12, 12, 16, 16);
        const floorMat = new THREE.MeshStandardMaterial({ color: 0x0f172a, roughness: 0.8, metalness: 0.2 });
        const floor = new THREE.Mesh(floorGeo, floorMat);
        floor.rotation.x = -Math.PI / 2;
        floor.receiveShadow = true;
        scene.add(floor);

        const gridHelper = new THREE.GridHelper(12, 12, 0x10b981, 0x065f46);
        gridHelper.position.y = 0.02;
        scene.add(gridHelper);

        const wallMat = new THREE.MeshStandardMaterial({ color: 0x1e293b, roughness: 0.9 });
        
        const backWall = new THREE.Mesh(new THREE.BoxGeometry(12, 5, 0.6), wallMat);
        backWall.position.set(0, 2.5, -6);
        scene.add(backWall);

        const leftWall = new THREE.Mesh(new THREE.BoxGeometry(0.6, 5, 12), wallMat);
        leftWall.position.set(-6, 2.5, 0);
        scene.add(leftWall);

        // --- 3. SPIELFIGUR (Epischer Dark Fantasy Ritter) ---
        playerGroup = new THREE.Group();
        const armorMat = new THREE.MeshStandardMaterial({ color: 0x111827, metalness: 0.95, roughness: 0.2 });

        const torso = new THREE.Mesh(new THREE.BoxGeometry(0.5, 0.65, 0.3), armorMat);
        torso.position.y = 0.5;
        playerGroup.add(torso);

        const head = new THREE.Mesh(new THREE.BoxGeometry(0.32, 0.32, 0.32), armorMat);
        head.position.y = 0.95;
        playerGroup.add(head);

        const visor = new THREE.Mesh(new THREE.BoxGeometry(0.26, 0.06, 0.35), new THREE.MeshBasicMaterial({ color: 0x38bdf8 }));
        visor.position.set(0, 0.98, 0);
        playerGroup.add(visor);

        const sword = new THREE.Mesh(new THREE.BoxGeometry(0.12, 1.3, 0.04), new THREE.MeshBasicMaterial({ color: 0x34d399 }));
        sword.position.set(0.45, 0.5, 0.25);
        sword.rotation.z = -0.3;
        playerGroup.add(sword);

        const auraRing = new THREE.Mesh(
            new THREE.RingGeometry(0.5, 0.7, 32),
            new THREE.MeshBasicMaterial({ color: 0x10b981, side: THREE.DoubleSide, transparent: true, opacity: 0.9 })
        );
        auraRing.rotation.x = -Math.PI / 2;
        auraRing.position.y = 0.03;
        playerGroup.add(auraRing);

        scene.add(playerGroup);

        // --- 4. BACKEND-DATEN LADEN & OBJEKT-GENERIERUNG ---
        async function fetchAIState() {
            try {
                const response = await fetch('world_state.json?' + new Date().getTime());
                if (response.ok) {
                    const data = await response.json();
                    const modulesStr = data.modules ? data.modules.join(', ').replace(/\*\*/g, '') : 'Core';
                    document.getElementById('aiStatus').innerHTML = 
                        `<b>🤖 Autopilot Status:</b> ${data.status.replace(/\*\*/g, '')}<br>` +
                        `<b>📦 Aktive Backend-Module (${data.features_count}):</b> <span style="color: #58a6ff;">${modulesStr}</span>`;

                    if (data.dungeon_objects && interactiveObjects.length === 0) {
                        data.dungeon_objects.forEach(obj => {
                            if (obj.type === 'chest') {
                                const chest = createChest();
                                chest.position.set(obj.x, 0, obj.z);
                                scene.add(chest);
                                interactiveObjects.push({ mesh: chest, type: 'chest', loot: obj.loot });
                            } else if (obj.type === 'crystal') {
                                const crystal = createCrystal(obj.color);
                                crystal.position.set(obj.x, 0.3, obj.z);
                                scene.add(crystal);
                            }
                        });
                    }
                }
            } catch (e) {}
        }

        function createChest() {
            const group = new THREE.Group();
            const body = new THREE.Mesh(
                new THREE.BoxGeometry(0.6, 0.4, 0.4), 
                new THREE.MeshStandardMaterial({ color: 0x78350f, roughness: 0.5 })
            );
            body.position.y = 0.2;
            group.add(body);
            
            const lock = new THREE.Mesh(
                new THREE.BoxGeometry(0.12, 0.12, 0.08), 
                new THREE.MeshStandardMaterial({ color: 0xf59e0b, metalness: 0.8 })
            );
            lock.position.set(0, 0.2, 0.21);
            group.add(lock);
            return group;
        }

        function createCrystal(colorType) {
            const color = colorType === 'blue' ? 0x38bdf8 : 0x34d399;
            const mesh = new THREE.Mesh(
                new THREE.OctahedronGeometry(0.25),
                new THREE.MeshBasicMaterial({ color: color })
            );
            return mesh;
        }

        fetchAIState();
        setInterval(fetchAIState, 15000);

        // --- 5. TOUCH & KLICK STEUERUNG ---
        renderer.domElement.addEventListener('pointerdown', (e) => {
            const rect = renderer.domElement.getBoundingClientRect();
            mouse.x = ((e.clientX - rect.left) / rect.width) * 2 - 1;
            mouse.y = -((e.clientY - rect.top) / rect.height) * 2 + 1;

            raycaster.setFromCamera(mouse, camera);
            const intersects = raycaster.intersectObject(floor);
            if (intersects.length > 0) {
                targetPosition = intersects[0].point;
                targetPosition.x = Math.max(-5, Math.min(5, targetPosition.x));
                targetPosition.z = Math.max(-5, Math.min(5, targetPosition.z));
            }
        });

        function log(msg) {
            const box = document.getElementById('console');
            box.innerHTML += `> ${msg}<br>`;
            box.scrollTop = box.scrollHeight;
        }

        function updateUI() {
            document.getElementById('hp').innerText = stats.hp;
            document.getElementById('gold').innerText = stats.gold;
            document.getElementById('xp').innerText = stats.xp;
        }

        // --- 6. RENDER-SCHLEIFE ---
        function animate() {
            requestAnimationFrame(animate);

            let speed = 0.05;
            if (targetPosition) {
                const dir = new THREE.Vector3().subVectors(targetPosition, playerGroup.position);
                if (dir.length() > 0.1) {
                    dir.y = 0;
                    dir.normalize();
                    playerGroup.position.addScaledVector(dir, speed);
                    playerGroup.lookAt(targetPosition.x, playerGroup.position.y, targetPosition.z);
                } else {
                    targetPosition = null;
                }
            }

            auraRing.rotation.z += 0.025;

            interactiveObjects.forEach((obj, index) => {
                if (playerGroup.position.distanceTo(obj.mesh.position) < 0.8) {
                    stats.gold += 50;
                    stats.xp += 100;
                    log(`💎 Truhe geöffnet (${obj.loot})! +50 Gold`);
                    updateUI();
                    scene.remove(obj.mesh);
                    interactiveObjects.splice(index, 1);
                    targetPosition = null;
                }
            });

            renderer.render(scene, camera);
        }

        animate();
    </script>
</body>
</html>
