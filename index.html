<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>KI-RPG-Projekt | Autonome Live-Welt</title>
    <style>
        body {
            background-color: #05070a;
            color: #c9d1d9;
            font-family: 'Courier New', Courier, monospace;
            text-align: center;
            padding: 10px;
            margin: 0;
            overflow: hidden;
            touch-action: none;
        }
        .container {
            max-width: 700px;
            margin: 0 auto;
            border: 2px solid #30363d;
            padding: 12px;
            border-radius: 12px;
            background-color: #0d1117;
            box-shadow: 0 10px 30px rgba(0,0,0,0.8);
        }
        h1 {
            color: #58a6ff;
            font-size: 1.4rem;
            margin: 4px 0;
        }
        .ai-status {
            font-size: 0.75rem;
            color: #3fb950;
            background: #161b22;
            padding: 4px;
            border-radius: 4px;
            border: 1px solid #30363d;
            margin-bottom: 6px;
        }
        #webgl-container {
            width: 100%;
            height: 280px;
            border-radius: 8px;
            border: 1px solid #30363d;
            margin: 6px 0;
            background: #020408;
            position: relative;
            cursor: pointer;
        }
        .stats-box {
            display: flex;
            justify-content: space-around;
            background: #161b22;
            padding: 6px;
            border-radius: 6px;
            margin: 6px 0;
            border: 1px solid #30363d;
            font-weight: bold;
            font-size: 0.85rem;
        }
        .console {
            background: #020408;
            color: #3fb950;
            border: 1px solid #30363d;
            padding: 6px;
            height: 60px;
            overflow-y: auto;
            text-align: left;
            font-size: 0.75rem;
            border-radius: 6px;
        }
    </style>
    <!-- Three.js -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>

    <div class="container">
        <h1>⚔️ KI-3D-RPG: Autonomes Live-Netzwerk</h1>
        <div class="ai-status" id="aiStatus">🤖 Autonomer Loop aktiv</div>
        
        <!-- 3D Canvas Viewport -->
        <div id="webgl-container"></div>

        <div class="stats-box">
            <div>❤️ HP: <span id="hp">100</span></div>
            <div>🪙 Gold: <span id="gold">0</span></div>
            <div>⭐ XP: <span id="xp">0</span></div>
        </div>

        <div class="console" id="console">
            [System] 3D-Dungeon erfolgreich initialisiert.<br>
        </div>
    </div>

    <script>
        // --- LIVE DATEN LADEN ---
        async function loadRepositoryData() {
            try {
                const response = await fetch('world_state.json');
                if (response.ok) {
                    const data = await response.json();
                    document.getElementById('aiStatus').innerText = `🤖 Modul aktiv: ${data.latest_module || 'Quantum Core'}`;
                }
            } catch (e) {
                // Fallback im Standby
            }
        }
        loadRepositoryData();

        // --- 3D SZENE & RITTER ---
        const container = document.getElementById('webgl-container');
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x020408);

        const camera = new THREE.PerspectiveCamera(45, container.clientWidth / container.clientHeight, 0.1, 1000);
        camera.position.set(10, 12, 10);
        camera.lookAt(0, 0, 0);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(container.clientWidth, container.clientHeight);
        container.appendChild(renderer.domElement);

        scene.add(new THREE.AmbientLight(0x1f2937, 0.8));
        const neonLight = new THREE.PointLight(0x3fb950, 2, 15);
        neonLight.position.set(0, 2, 0);
        scene.add(neonLight);

        // Boden & Grid
        const floor = new THREE.Mesh(
            new THREE.PlaneGeometry(10, 10),
            new THREE.MeshStandardMaterial({ color: 0x11161d, roughness: 0.9 })
        );
        floor.rotation.x = -Math.PI / 2;
        scene.add(floor);

        const gridHelper = new THREE.GridHelper(10, 10, 0x3fb950, 0x1a472a);
        gridHelper.position.y = 0.01;
        scene.add(gridHelper);

        // Wände
        const wallMat = new THREE.MeshStandardMaterial({ color: 0x1f242c, roughness: 0.8 });
        
        const backWall = new THREE.Mesh(new THREE.BoxGeometry(10, 5, 0.5), wallMat);
        backWall.position.set(0, 2.5, -5);
        scene.add(backWall);

        const leftWall = new THREE.Mesh(new THREE.BoxGeometry(0.5, 5, 10), wallMat);
        leftWall.position.set(-5, 2.5, 0);
        scene.add(leftWall);

        // Ritter Spielfigur
        const playerGroup = new THREE.Group();
        const bodyMat = new THREE.MeshStandardMaterial({ color: 0x30363d, metalness: 0.8, roughness: 0.2 });
        
        const torso = new THREE.Mesh(new THREE.BoxGeometry(0.6, 0.8, 0.4), bodyMat);
        torso.position.y = 0.6;
        playerGroup.add(torso);

        const head = new THREE.Mesh(new THREE.BoxGeometry(0.4, 0.4, 0.4), bodyMat);
        head.position.y = 1.1;
        playerGroup.add(head);

        const eye = new THREE.Mesh(new THREE.BoxGeometry(0.25, 0.08, 0.45), new THREE.MeshBasicMaterial({ color: 0x58a6ff }));
        eye.position.set(0, 1.12, 0);
        playerGroup.add(eye);

        const sword = new THREE.Mesh(new THREE.BoxGeometry(0.15, 1.2, 0.05), new THREE.MeshStandardMaterial({ color: 0x8b949e, metalness: 0.9 }));
        sword.position.set(0.4, 0.6, 0.3);
        sword.rotation.z = -0.3;
        playerGroup.add(sword);

        const auraRing = new THREE.Mesh(
            new THREE.RingGeometry(0.6, 0.8, 32),
            new THREE.MeshBasicMaterial({ color: 0x3fb950, side: THREE.DoubleSide, transparent: true, opacity: 0.7 })
        );
        auraRing.rotation.x = -Math.PI / 2;
        auraRing.position.y = 0.02;
        playerGroup.add(auraRing);

        scene.add(playerGroup);

        // Schatz
        const chest = new THREE.Mesh(
            new THREE.BoxGeometry(0.8, 0.6, 0.6),
            new THREE.MeshStandardMaterial({ color: 0x8957e5, roughness: 0.5 })
        );
        chest.position.set(3, 0.3, -3);
        scene.add(chest);

        // Touch & Klick Navigation
        let stats = { hp: 100, gold: 0, xp: 0 };
        let targetPosition = null;
        const raycaster = new THREE.Raycaster();
        const mouse = new THREE.Vector2();

        renderer.domElement.addEventListener('pointerdown', (e) => {
            const rect = renderer.domElement.getBoundingClientRect();
            mouse.x = ((e.clientX - rect.left) / rect.width) * 2 - 1;
            mouse.y = -((e.clientY - rect.top) / rect.height) * 2 + 1;

            raycaster.setFromCamera(mouse, camera);
            const intersects = raycaster.intersectObject(floor);
            if (intersects.length > 0) {
                targetPosition = intersects[0].point;
                targetPosition.x = Math.max(-4.2, Math.min(4.2, targetPosition.x));
                targetPosition.z = Math.max(-4.2, Math.min(4.2, targetPosition.z));
            }
        });

        function log(msg) {
            const box = document.getElementById('console');
            box.innerHTML += `> ${msg}<br>`;
            box.scrollTop = box.scrollHeight;
        }

        function updateUI() {
            document.getElementById('hp').innerText = stats.hp;
            document.getElementById('gold').innerText = stats.gold;
            document.getElementById('xp').innerText = stats.xp;
        }

        function animate() {
            requestAnimationFrame(animate);

            let speed = 0.06;
            if (targetPosition) {
                const dir = new THREE.Vector3().subVectors(targetPosition, playerGroup.position);
                if (dir.length() > 0.1) {
                    dir.y = 0;
                    dir.normalize();
                    playerGroup.position.addScaledVector(dir, speed);
                    playerGroup.lookAt(targetPosition.x, playerGroup.position.y, targetPosition.z);
                } else {
                    targetPosition = null;
                }
            }

            auraRing.rotation.z += 0.02;

            if (playerGroup.position.distanceTo(chest.position) < 1.0) {
                stats.gold += 50;
                stats.xp += 100;
                log("💎 Schatz eingesammelt! +50 Gold, +100 XP");
                updateUI();
                chest.position.set((Math.random() - 0.5) * 6, 0.3, (Math.random() - 0.5) * 6);
                targetPosition = null;
            }

            renderer.render(scene, camera);
        }

        animate();
    </script>
</body>
</html>
