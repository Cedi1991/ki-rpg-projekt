<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KI-RPG-Projekt | 3D Web-Version</title>
    <style>
        body {
            background-color: #0d1117;
            color: #c9d1d9;
            font-family: 'Courier New', Courier, monospace;
            text-align: center;
            padding: 10px;
            margin: 0;
            overflow-x: hidden;
        }
        .container {
            max-width: 650px;
            margin: 0 auto;
            border: 2px solid #30363d;
            padding: 15px;
            border-radius: 12px;
            background-color: #161b22;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }
        h1 {
            color: #58a6ff;
            font-size: 1.8rem;
            margin: 5px 0;
        }
        #webgl-container {
            width: 100%;
            height: 220px;
            border-radius: 8px;
            border: 1px solid #30363d;
            margin: 10px 0;
            background: #010409;
        }
        .stats-box {
            display: flex;
            justify-content: space-around;
            background: #0d1117;
            padding: 8px;
            border-radius: 8px;
            margin: 10px 0;
            border: 1px solid #30363d;
            font-weight: bold;
            font-size: 0.95rem;
        }
        .console {
            background: #010409;
            color: #7ee787;
            border: 1px solid #30363d;
            padding: 10px;
            height: 100px;
            overflow-y: auto;
            text-align: left;
            font-size: 0.85rem;
            border-radius: 8px;
            margin-bottom: 10px;
        }
        .btn-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
        }
        button {
            background-color: #238636;
            color: white;
            border: none;
            padding: 10px;
            border-radius: 6px;
            font-family: 'Courier New', Courier, monospace;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.2s;
        }
        button:hover {
            background-color: #2ea043;
        }
        button.secondary {
            background-color: #21262d;
            border: 1px solid #30363d;
            color: #c9d1d9;
        }
        button.secondary:hover {
            background-color: #30363d;
        }
    </style>
    <!-- Three.js für echte 3D-Grafik im Browser -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>

    <div class="container">
        <h1>⚔️ KI-3D-RPG</h1>
        
        <!-- 3D Canvas Viewport -->
        <div id="webgl-container"></div>

        <div class="stats-box">
            <div>❤️ HP: <span id="hp">100</span>/<span id="maxHp">100</span></div>
            <div>🪙 Gold: <span id="gold">10</span></div>
            <div>⭐ XP: <span id="xp">0</span></div>
        </div>

        <div class="console" id="console">
            [System] 3D-Engine initialisiert. Willkommen in der autonomen Welt!<br>
        </div>

        <div class="btn-grid">
            <button onclick="exploreDungeon()">🗺️ Dungeon erkunden</button>
            <button onclick="restAtCamp()" class="secondary">⛺ Am Lager ruhen</button>
            <button onclick="craftItem()" class="secondary">⚒️ Ausrüstung schmieden</button>
            <button onclick="resetGame()" style="background-color: #da3633;">🔄 Neustart</button>
        </div>
    </div>

    <script>
        // --- THREE.JS 3D SZENE ---
        const container = document.getElementById('webgl-container');
        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(60, container.clientWidth / container.clientHeight, 0.1, 1000);
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(container.clientWidth, container.clientHeight);
        container.appendChild(renderer.domElement);

        // Lichtquellen
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
        scene.add(ambientLight);
        const pointLight = new THREE.PointLight(0x58a6ff, 1.5, 50);
        pointLight.position.set(5, 5, 5);
        scene.add(pointLight);

        // 3D-Objekt (Spieler / Magischer Kristall in der 3D-Welt)
        const geometry = new THREE.BoxGeometry(1.5, 1.5, 1.5);
        const material = new THREE.MeshStandardMaterial({ 
            color: 0x238636, 
            roughness: 0.3, 
            metalness: 0.8 
        });
        const playerMesh = new THREE.Mesh(geometry, material);
        scene.add(playerMesh);

        // Ein paar 3D-Dungeon-Säulen im Hintergrund
        const pillars = [];
        for (let i = 0; i < 4; i++) {
            const pGeo = new THREE.CylinderGeometry(0.3, 0.3, 3, 8);
            const pMat = new THREE.MeshStandardMaterial({ color: 303030 });
            const pillar = new THREE.Mesh(pGeo, pMat);
            const angle = (i / 4) * Math.PI * 2;
            pillar.position.set(Math.cos(angle) * 4, 0, Math.sin(angle) * 4);
            scene.add(pillar);
            pillars.push(pillar);
        }

        camera.position.set(0, 2, 5);
        camera.lookAt(0, 0, 0);

        // Render-Schleife (Animation)
        function animate() {
            requestAnimationFrame(animate);
            playerMesh.rotation.x += 0.01;
            playerMesh.rotation.y += 0.015;
            renderer.render(scene, camera);
        }
        animate();

        // --- RPG SPIEL-LOGIK ---
        let player = { hp: 100, maxHp: 100, gold: 10, xp: 0 };

        function log(message) {
            const consoleBox = document.getElementById('console');
            consoleBox.innerHTML += `> ${message}<br>`;
            consoleBox.scrollTop = consoleBox.scrollHeight;
        }

        function updateStats() {
            document.getElementById('hp').innerText = player.hp;
            document.getElementById('maxHp').innerText = player.maxHp;
            document.getElementById('gold').innerText = player.gold;
            document.getElementById('xp').innerText = player.xp;
        }

        function exploreDungeon() {
            // Effekt auf das 3D-Objekt bei Aktion (kurz rot aufleuchten)
            playerMesh.material.color.setHex(0xda3633);
            setTimeout(() => playerMesh.material.color.setHex(0x238636), 300);

            const events = [
                { text: "Du hast einen Dungeon-Wächter besiegt!", gold: 15, xp: 20, damage: 15 },
                { text: "Eine verlassene Schatzkammer entdeckt!", gold: 35, xp: 40, damage: 20 },
                { text: "Eine Magiefalle schnappt zu!", gold: 5, xp: 10, damage: 25 },
                { text: "Der Raum ist sicher. Du ruhst kurz aus.", gold: 10, xp: 5, damage: 5 }
            ];
            
            const event = events[Math.floor(Math.random() * events.length)];
            player.hp -= event.damage;
            player.gold += event.gold;
            player.xp += event.xp;

            log(event.text);
            log(`Status: -${event.damage} HP, +${event.gold} Gold, +${event.xp} XP`);

            if (player.hp <= 0) {
                player.hp = 0;
                log("💀 Du wurdest besiegt! Wiederbelebung am Startpunkt...");
                alert("Du wurdest im Dungeon besiegt!");
                resetGame();
                return;
            }
            updateStats();
        }

        function restAtCamp() {
            if (player.gold >= 5) {
                player.gold -= 5;
                player.hp = Math.min(player.maxHp, player.hp + 40);
                log("⛺ Am Lagerfeuer regeneriert. HP voll! (-5 Gold).");
            } else {
                log("❌ Zu wenig Gold für die Rast.");
            }
            updateStats();
        }

        function craftItem() {
            if (player.gold >= 20) {
                player.gold -= 20;
                player.maxHp += 20;
                player.hp = player.maxHp;
                log("⚒️ Legendäre Ausrüstung geschmiedet! Max HP erhöht.");
                // 3D-Objekt verändern
                playerMesh.scale.set(1.2, 1.2, 1.2);
            } else {
                log("❌ Du benötigst 20 Gold zum Schmieden.");
            }
            updateStats();
        }

        function resetGame() {
            player = { hp: 100, maxHp: 100, gold: 10, xp: 0 };
            playerMesh.scale.set(1, 1, 1);
            document.getElementById('console').innerHTML = "[System] Spielstand zurückgesetzt.<br>";
            updateStats();
        }
    </script>
</body>
</html>
