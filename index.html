<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KI-RPG-Projekt | 3D-Steuerbare Welt</title>
    <style>
        body {
            background-color: #0d1117;
            color: #c9d1d9;
            font-family: 'Courier New', Courier, monospace;
            text-align: center;
            padding: 10px;
            margin: 0;
            overflow: hidden;
        }
        .container {
            max-width: 700px;
            margin: 0 auto;
            border: 2px solid #30363d;
            padding: 15px;
            border-radius: 12px;
            background-color: #161b22;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }
        h1 {
            color: #58a6ff;
            font-size: 1.6rem;
            margin: 5px 0;
        }
        #webgl-container {
            width: 100%;
            height: 280px;
            border-radius: 8px;
            border: 1px solid #30363d;
            margin: 10px 0;
            background: #010409;
            position: relative;
        }
        .controls-hint {
            font-size: 0.8rem;
            color: #8b949e;
            margin-bottom: 8px;
        }
        .stats-box {
            display: flex;
            justify-content: space-around;
            background: #0d1117;
            padding: 8px;
            border-radius: 8px;
            margin: 8px 0;
            border: 1px solid #30363d;
            font-weight: bold;
            font-size: 0.9rem;
        }
        .console {
            background: #010409;
            color: #7ee787;
            border: 1px solid #30363d;
            padding: 8px;
            height: 80px;
            overflow-y: auto;
            text-align: left;
            font-size: 0.8rem;
            border-radius: 8px;
            margin-bottom: 8px;
        }
    </style>
    <!-- Three.js für die 3D-Grafik -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>

    <div class="container">
        <h1>⚔️ KI-3D-RPG: Steuerbarer Held</h1>
        <div class="controls-hint">🎮 Steuerung: Benutze die <b>Pfeiltasten</b> oder <b>W, A, S, D</b>, um die Spielfigur im 3D-Dungeon zu bewegen!</div>
        
        <!-- 3D Canvas Viewport -->
        <div id="webgl-container"></div>

        <div class="stats-box">
            <div>❤️ HP: <span id="hp">100</span></div>
            <div>🪙 Gold: <span id="gold">0</span></div>
            <div>⭐ XP: <span id="xp">0</span></div>
        </div>

        <div class="console" id="console">
            [System] 3D-Welt geladen. Steuere deinen Helden durch den Dungeon!<br>
        </div>
    </div>

    <script>
        // --- 3D SZENE INITIALISIERUNG ---
        const container = document.getElementById('webgl-container');
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x05070a);

        const camera = new THREE.PerspectiveCamera(60, container.clientWidth / container.clientHeight, 0.1, 1000);
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(container.clientWidth, container.clientHeight);
        container.appendChild(renderer.domElement);

        // Licht
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.7);
        scene.add(ambientLight);
        const pointLight = new THREE.PointLight(0x58a6ff, 2, 50);
        pointLight.position.set(0, 10, 0);
        scene.add(pointLight);

        // Bodenplatte (Dungeon-Raum)
        const floorGeo = new THREE.PlaneGeometry(20, 20);
        const floorMat = new THREE.MeshStandardMaterial({ color: 0x161b22, roughness: 0.9 });
        const floor = new THREE.Mesh(floorGeo, floorMat);
        floor.rotation.x = -Math.PI / 2;
        scene.add(floor);

        // Spielfigur (Helden-Würfel)
        const playerGeo = new THREE.BoxGeometry(0.8, 0.8, 0.8);
        const playerMat = new THREE.MeshStandardMaterial({ color: 0x238636, metalness: 0.5 });
        const player = new THREE.Mesh(playerGeo, playerMat);
        player.position.y = 0.4;
        scene.add(player);

        // Sammelbarer Schatz (Goldkristall)
        const gemGeo = new THREE.OctahedronGeometry(0.4);
        const gemMat = new THREE.MeshStandardMaterial({ color: 0xd29922, emissive: 0x6e4002 });
        const gem = new THREE.Mesh(gemGeo, gemMat);
        gem.position.set(3, 0.4, -3);
        scene.add(gem);

        // Kamera-Position (Schräg von oben)
        camera.position.set(0, 6, 6);
        camera.lookAt(player.position);

        // --- SPIEL-LOGIK & STEUERUNG ---
        let stats = { hp: 100, gold: 0, xp: 0 };
        const keys = {};

        window.addEventListener('keydown', (e) => keys[e.key.toLowerCase()] = true);
        window.addEventListener('keyup', (e) => keys[e.key.toLowerCase()] = false);

        function log(msg) {
            const box = document.getElementById('console');
            box.innerHTML += `> ${msg}<br>`;
            box.scrollTop = box.scrollHeight;
        }

        function updateUI() {
            document.getElementById('hp').innerText = stats.hp;
            document.getElementById('gold').innerText = stats.gold;
            document.getElementById('xp').innerText = stats.xp;
        }

        // Animations- und Bewegungs-Schleife
        function animate() {
            requestAnimationFrame(animate);

            let speed = 0.05;
            if (keys['w'] || keys['arrowup']) player.position.z -= speed;
            if (keys['s'] || keys['arrowdown']) player.position.z += speed;
            if (keys['a'] || keys['arrowleft']) player.position.x -= speed;
            if (keys['d'] || keys['arrowright']) player.position.x += speed;

            // Begrenzung im Dungeon
            player.position.x = Math.max(-9, Math.min(9, player.position.x));
            player.position.z = Math.max(-9, Math.min(9, player.position.z));

            // Kamera folgt dem Spieler sanft
            camera.position.x = player.position.x;
            camera.position.z = player.position.z + 6;
            camera.lookAt(player.position);

            // Rotation des Sammelgegenstands
            gem.rotation.y += 0.02;

            // Kollisionsabfrage mit dem Goldkristall
            if (player.position.distanceTo(gem.position) < 1.0) {
                stats.gold += 25;
                stats.xp += 50;
                log("✨ Schatz eingesammelt! +25 Gold, +50 XP");
                updateUI();
                // Kristall an neue zufällige Position teleportieren
                gem.position.set(
                    (Math.random() - 0.5) * 14,
                    0.4,
                    (Math.random() - 0.5) * 14
                );
            }

            renderer.render(scene, camera);
        }

        animate();
    </script>
</body>
</html>
