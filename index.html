<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>KI-3D-RPG | AAA Photorealistic Engine</title>
    <style>
        body {
            background-color: #010204;
            color: #c9d1d9;
            font-family: 'Courier New', Courier, monospace;
            text-align: center;
            padding: 6px;
            margin: 0;
            overflow: hidden;
            touch-action: none;
        }
        .container {
            max-width: 700px;
            margin: 0 auto;
            border: 1px solid #21262d;
            padding: 8px;
            border-radius: 12px;
            background-color: #0d1117;
            box-shadow: 0 20px 40px rgba(0,0,0,0.95);
        }
        h1 {
            color: #58a6ff;
            font-size: 1.15rem;
            margin: 2px 0 4px 0;
            text-shadow: 0 0 12px rgba(88,166,255,0.6);
        }
        .ai-status {
            font-size: 0.7rem;
            color: #3fb950;
            background: #161b22;
            padding: 4px 6px;
            border-radius: 6px;
            border: 1px solid #30363d;
            margin-bottom: 4px;
            text-align: left;
            line-height: 1.25;
        }
        #webgl-container {
            width: 100%;
            height: 320px;
            border-radius: 8px;
            border: 1px solid #30363d;
            margin: 4px 0;
            background: #000000;
            position: relative;
            cursor: pointer;
            box-shadow: inset 0 0 35px rgba(0,0,0,0.95);
        }
        .stats-box {
            display: flex;
            justify-content: space-around;
            background: #161b22;
            padding: 5px;
            border-radius: 6px;
            margin: 4px 0;
            border: 1px solid #30363d;
            font-weight: bold;
            font-size: 0.8rem;
        }
        .console {
            background: #000205;
            color: #3fb950;
            border: 1px solid #30363d;
            padding: 5px;
            height: 45px;
            overflow-y: auto;
            text-align: left;
            font-size: 0.68rem;
            border-radius: 6px;
        }
    </style>
    <!-- Three.js & Postprocessing CDN -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>

    <div class="container">
        <h1>⚔️ KI-3D-RPG: AAA Real-Engine</h1>
        <div class="ai-status" id="aiStatus">🤖 Synchronisiere High-End Shader...</div>
        
        <!-- Photoreal 3D Viewport -->
        <div id="webgl-container"></div>

        <div class="stats-box">
            <div>❤️ HP: <span id="hp">100</span></div>
            <div>🪙 Gold: <span id="gold">0</span></div>
            <div>⭐ XP: <span id="xp">0</span></div>
        </div>

        <div class="console" id="console">
            [System] Fotorealistische Shader & dynamische Verfolgungskamera aktiv.<br>
        </div>
    </div>

    <script>
        let pointLight, floor, playerGroup;

        // --- 1. LIVE REPOSITORY DATEN LADEN ---
        async function fetchAIState() {
            try {
                const response = await fetch('world_state.json?' + new Date().getTime());
                if (response.ok) {
                    const data = await response.json();
                    const modulesStr = data.modules ? data.modules.join(', ').replace(/\*\*/g, '') : 'Core';
                    document.getElementById('aiStatus').innerHTML = 
                        `<b>🤖 Autopilot Status:</b> ${data.status.replace(/\*\*/g, '')}<br>` +
                        `<b>📦 Aktive Backend-Module (${data.features_count}):</b> <span style="color: #58a6ff;">${modulesStr}</span>`;
                
                    if (data.visual_theme && pointLight && data.visual_theme.light_color) {
                        pointLight.color.set(data.visual_theme.light_color);
                    }
                }
            } catch (e) {}
        }
        fetchAIState();
        setInterval(fetchAIState, 15000);

        // --- 2. AAA-ENGINE SETUP ---
        const container = document.getElementById('webgl-container');
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x010204);
        // Tiefer, cineastischer Nebel für realistische Tiefenwirkung
        scene.fog = new THREE.FogExp2(0x010204, 0.09);

        const camera = new THREE.PerspectiveCamera(45, container.clientWidth / container.clientHeight, 0.1, 1000);
        camera.position.set(0, 8, 7);
        camera.lookAt(0, 0, 0);

        const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: "high-performance" });
        renderer.setSize(container.clientWidth, container.clientHeight);
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;
        renderer.toneMapping = THREE.ACESFilmicToneMapping;
        renderer.toneMappingExposure = 1.2;
        container.appendChild(renderer.domElement);

        // Realistische Filmbeleuchtung
        scene.add(new THREE.AmbientLight(0x0d1322, 1.8));

        pointLight = new THREE.PointLight(0x58a6ff, 3.5, 22);
        pointLight.position.set(0, 6, 0);
        pointLight.castShadow = true;
        pointLight.shadow.mapSize.width = 1024;
        pointLight.shadow.mapSize.height = 1024;
        scene.add(pointLight);

        const torchLight = new THREE.PointLight(0xff7b72, 3.0, 14);
        torchLight.position.set(-4, 3, -4);
        scene.add(torchLight);

        // --- 3. FOTOREALE DUNGEON-UMGEBUNG ---
        const dungeonGroup = new THREE.Group();

        // Boden aus dunklem, reflektierenden Stein
        const floorGeo = new THREE.PlaneGeometry(16, 16, 32, 32);
        const floorMat = new THREE.MeshStandardMaterial({ 
            color: 0x07090d, 
            roughness: 0.6, 
            metalness: 0.3 
        });
        floor = new THREE.Mesh(floorGeo, floorMat);
        floor.rotation.x = -Math.PI / 2;
        floor.receiveShadow = true;
        dungeonGroup.add(floor);

        // Cineastische Felsen- und Steinwände
        const wallMat = new THREE.MeshStandardMaterial({ color: 0x0f141d, roughness: 0.85, metalness: 0.1 });
        
        const backWall = new THREE.Mesh(new THREE.BoxGeometry(16, 8, 0.8), wallMat);
        backWall.position.set(0, 4, -8);
        backWall.castShadow = true;
        backWall.receiveShadow = true;
        dungeonGroup.add(backWall);

        const leftWall = new THREE.Mesh(new THREE.BoxGeometry(0.8, 8, 16), wallMat);
        leftWall.position.set(-8, 4, 0);
        leftWall.castShadow = true;
        leftWall.receiveShadow = true;
        dungeonGroup.add(leftWall);

        scene.add(dungeonGroup);

        // --- 4. MAGISCHE ATMOSPHÄRE & RAUCH ---
        const particleCount = 100;
        const particleGeo = new THREE.BufferGeometry();
        const particlePositions = new Float32Array(particleCount * 3);

        for (let i = 0; i < particleCount * 3; i += 3) {
            particlePositions[i] = (Math.random() - 0.5) * 12;
            particlePositions[i + 1] = Math.random() * 6;
            particlePositions[i + 2] = (Math.random() - 0.5) * 12;
        }
        particleGeo.setAttribute('position', new THREE.BufferAttribute(particlePositions, 3));
        const particleMat = new THREE.PointsMaterial({ color: 0x79c0ff, size: 0.05, transparent: true, opacity: 0.7 });
        const particles = new THREE.Points(particleGeo, particleMat);
        scene.add(particles);

        // --- 5. HOCHWERTIGER HELD (Photorealistischer Ritter) ---
        playerGroup = new THREE.Group();
        const armorMat = new THREE.MeshStandardMaterial({ color: 0x1c2128, metalness: 0.95, roughness: 0.15 });
        const goldTrimMat = new THREE.MeshStandardMaterial({ color: 0xe3b341, metalness: 0.9, roughness: 0.2 });

        // Körper & Rüstung
        const torso = new THREE.Mesh(new THREE.BoxGeometry(0.5, 0.65, 0.32), armorMat);
        torso.position.y = 0.52;
        torso.castShadow = true;
        playerGroup.add(torso);

        const chestPlate = new THREE.Mesh(new THREE.BoxGeometry(0.35, 0.45, 0.38), goldTrimMat);
        chestPlate.position.set(0, 0.55, 0);
        playerGroup.add(chestPlate);

        const head = new THREE.Mesh(new THREE.BoxGeometry(0.32, 0.32, 0.32), armorMat);
        head.position.y = 1.0;
        head.castShadow = true;
        playerGroup.add(head);

        const visor = new THREE.Mesh(new THREE.BoxGeometry(0.26, 0.06, 0.35), new THREE.MeshBasicMaterial({ color: 0x58a6ff }));
        visor.position.set(0, 1.02, 0);
        playerGroup.add(visor);

        // Klinge mit echtem Neon-Leuchten
        const swordBlade = new THREE.Mesh(new THREE.BoxGeometry(0.1, 1.2, 0.03), new THREE.MeshBasicMaterial({ color: 0x56d364 }));
        swordBlade.position.set(0.42, 0.55, 0.3);
        swordBlade.rotation.z = -0.25;
        playerGroup.add(swordBlade);

        // Magischer Runen-Bodenkreis
        const auraRing = new THREE.Mesh(
            new THREE.RingGeometry(0.5, 0.7, 32),
            new THREE.MeshBasicMaterial({ color: 0x3fb950, side: THREE.DoubleSide, transparent: true, opacity: 0.8 })
        );
        auraRing.rotation.x = -Math.PI / 2;
        auraRing.position.y = 0.02;
        playerGroup.add(auraRing);

        scene.add(playerGroup);

        // --- 6. MYTHISCHE SCHATZTRUHE ---
        const chestGroup = new THREE.Group();
        const chestBody = new THREE.Mesh(new THREE.BoxGeometry(0.7, 0.45, 0.45), new THREE.MeshStandardMaterial({ color: 0x6e40c9, roughness: 0.3, metalness: 0.4 }));
        chestBody.position.y = 0.22;
        chestBody.castShadow = true;
        chestGroup.add(chestBody);
        
        const floatingGem = new THREE.Mesh(new THREE.OctahedronGeometry(0.15), new THREE.MeshBasicMaterial({ color: 0xf0883e }));
        floatingGem.position.set(0, 0.55, 0);
        chestGroup.add(floatingGem);
        
        chestGroup.position.set(3.5, 0, -3.5);
        scene.add(chestGroup);

        // --- 7. FLÜSSIGE TOUCH- & KAMERA-STEUERUNG ---
        let stats = { hp: 100, gold: 0, xp: 0 };
        let targetPosition = null;
        const raycaster = new THREE.Raycaster();
        const mouse = new THREE.Vector2();

        renderer.domElement.addEventListener('pointerdown', (e) => {
            const rect = renderer.domElement.getBoundingClientRect();
            mouse.x = ((e.clientX - rect.left) / rect.width) * 2 - 1;
            mouse.y = -((e.clientY - rect.top) / rect.height) * 2 + 1;

            raycaster.setFromCamera(mouse, camera);
            const intersects = raycaster.intersectObject(floor);
            if (intersects.length > 0) {
                targetPosition = intersects[0].point;
                targetPosition.x = Math.max(-6, Math.min(6, targetPosition.x));
                targetPosition.z = Math.max(-6, Math.min(6, targetPosition.z));
            }
        });

        function log(msg) {
            const box = document.getElementById('console');
            box.innerHTML += `> ${msg}<br>`;
            box.scrollTop = box.scrollHeight;
        }

        function updateUI() {
            document.getElementById('hp').innerText = stats.hp;
            document.getElementById('gold').innerText = stats.gold;
            document.getElementById('xp').innerText = stats.xp;
        }

        // --- 8. CINEASTISCHE RENDER-SCHLEIFE ---
        function animate() {
            requestAnimationFrame(animate);

            let speed = 0.055;
            if (targetPosition) {
                const dir = new THREE.Vector3().subVectors(targetPosition, playerGroup.position);
                if (dir.length() > 0.1) {
                    dir.y = 0;
                    dir.normalize();
                    playerGroup.position.addScaledVector(dir, speed);
                    playerGroup.lookAt(targetPosition.x, playerGroup.position.y, targetPosition.z);

                    // Sanfte Kamera-Verfolgung für echten Game-Look
                    camera.position.x += (playerGroup.position.x - camera.position.x) * 0.05;
                    camera.position.z += (playerGroup.position.z + 7 - camera.position.z) * 0.05;
                } else {
                    targetPosition = null;
                }
            }

            // Animationen
            auraRing.rotation.z += 0.03;
            floatingGem.rotation.y += 0.04;
            floatingGem.position.y = 0.55 + Math.sin(Date.now() * 0.005) * 0.08;
            torchLight.intensity = 2.5 + Math.sin(Date.now() * 0.007) * 0.8;

            // Partikel-Schweben
            const positions = particles.geometry.attributes.position.array;
            for (let i = 1; i < positions.length; i += 3) {
                positions[i] -= 0.003;
                if (positions[i] < 0) positions[i] = 6;
            }
            particles.geometry.attributes.position.needsUpdate = true;

            // Schatz-Kollision
            if (playerGroup.position.distanceTo(chestGroup.position) < 0.9) {
                stats.gold += 50;
                stats.xp += 100;
                log("💎 Mythischen Schatz eingesammelt! +50 Gold");
                updateUI();
                chestGroup.position.set((Math.random() - 0.5) * 10, 0, (Math.random() - 0.5) * 10);
                targetPosition = null;
            }

            renderer.render(scene, camera);
        }

        animate();
    </script>
</body>
</html>
