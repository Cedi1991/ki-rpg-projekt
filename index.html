<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>KI-3D-RPG | Next-Gen Autonome Welt</title>
    <style>
        body {
            background-color: #030508;
            color: #c9d1d9;
            font-family: 'Courier New', Courier, monospace;
            text-align: center;
            padding: 8px;
            margin: 0;
            overflow: hidden;
            touch-action: none;
        }
        .container {
            max-width: 700px;
            margin: 0 auto;
            border: 1px solid #30363d;
            padding: 10px;
            border-radius: 10px;
            background-color: #0d1117;
            box-shadow: 0 15px 35px rgba(0,0,0,0.9);
        }
        h1 {
            color: #58a6ff;
            font-size: 1.2rem;
            margin: 2px 0 6px 0;
            text-shadow: 0 0 10px rgba(88,166,255,0.4);
        }
        .ai-status {
            font-size: 0.72rem;
            color: #3fb950;
            background: #161b22;
            padding: 5px;
            border-radius: 6px;
            border: 1px solid #30363d;
            margin-bottom: 6px;
            text-align: left;
            line-height: 1.3;
        }
        #webgl-container {
            width: 100%;
            height: 300px;
            border-radius: 8px;
            border: 1px solid #30363d;
            margin: 4px 0;
            background: #010306;
            position: relative;
            cursor: pointer;
            box-shadow: inset 0 0 20px rgba(0,0,0,0.8);
        }
        .stats-box {
            display: flex;
            justify-content: space-around;
            background: #161b22;
            padding: 6px;
            border-radius: 6px;
            margin: 6px 0;
            border: 1px solid #30363d;
            font-weight: bold;
            font-size: 0.82rem;
        }
        .console {
            background: #010306;
            color: #3fb950;
            border: 1px solid #30363d;
            padding: 6px;
            height: 50px;
            overflow-y: auto;
            text-align: left;
            font-size: 0.7rem;
            border-radius: 6px;
        }
    </style>
    <!-- Three.js CDN -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>

    <div class="container">
        <h1>⚔️ KI-3D-RPG: Autonome Backend-Welt</h1>
        <div class="ai-status" id="aiStatus">🤖 Verbinde mit Python-Backend & Modulen...</div>
        
        <!-- Echtes 3D WebGL Viewport -->
        <div id="webgl-container"></div>

        <div class="stats-box">
            <div>❤️ HP: <span id="hp">100</span></div>
            <div>🪙 Gold: <span id="gold">0</span></div>
            <div>⭐ XP: <span id="xp">0</span></div>
        </div>

        <div class="console" id="console">
            [System] 3D-Engine initialisiert. Tippe ins Bild, um den Ritter zu steuern.<br>
        </div>
    </div>

    <script>
        let pointLight, floor;

        // --- 1. LIVE DATEN AUS DEM REPOSITORY LADEN ---
        async function fetchAIState() {
            try {
                const response = await fetch('world_state.json?' + new Date().getTime());
                if (response.ok) {
                    const data = await response.json();
                    const modulesStr = data.modules ? data.modules.join(', ').replace(/\*\*/g, '') : 'Core';
                    document.getElementById('aiStatus').innerHTML = 
                        `<b>🤖 Autopilot Status:</b> ${data.status.replace(/\*\*/g, '')}<br>` +
                        `<b>📦 Aktive Backend-Module (${data.features_count}):</b> <span style="color: #58a6ff;">${modulesStr}</span>`;
                
                    // Übernehme visuelle Design-Parameter direkt von der KI
                    if (data.visual_theme) {
                        if (pointLight && data.visual_theme.light_color) {
                            pointLight.color.set(data.visual_theme.light_color);
                        }
                        if (floor && data.visual_theme.floor_color) {
                            floor.material.color.set(data.visual_theme.floor_color);
                        }
                    }
                } else {
                    document.getElementById('aiStatus').innerHTML = "🤖 Autonomer Loop aktiv (Warte auf State-Sync)";
                }
            } catch (e) {
                document.getElementById('aiStatus').innerHTML = "🤖 Autonomer Loop aktiv (Standby)";
            }
        }
        fetchAIState();
        setInterval(fetchAIState, 15000);

        // --- 2. NEXT-GEN 3D THREE.JS ENGINE ---
        const container = document.getElementById('webgl-container');
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x020408);
        scene.fog = new THREE.FogExp2(0x020408, 0.08);

        const camera = new THREE.PerspectiveCamera(50, container.clientWidth / container.clientHeight, 0.1, 1000);
        camera.position.set(0, 10, 9);
        camera.lookAt(0, 0, 0);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(container.clientWidth, container.clientHeight);
        renderer.shadowMap.enabled = true;
        container.appendChild(renderer.domElement);

        // Lichtquellen
        const ambientLight = new THREE.AmbientLight(0x111927, 1.2);
        scene.add(ambientLight);

        pointLight = new THREE.PointLight(0x58a6ff, 2.5, 18);
        pointLight.position.set(0, 4, 0);
        scene.add(pointLight);

        const fireLight = new THREE.PointLight(0xf85149, 2, 10);
        fireLight.position.set(-3, 2, -3);
        scene.add(fireLight);

        // Dungeon Stein-Boden
        const floorGeo = new THREE.PlaneGeometry(12, 12);
        const floorMat = new THREE.MeshStandardMaterial({ color: 0x0d1117, roughness: 0.9, metalness: 0.1 });
        floor = new THREE.Mesh(floorGeo, floorMat);
        floor.rotation.x = -Math.PI / 2;
        scene.add(floor);

        const gridHelper = new THREE.GridHelper(12, 12, 0x30363d, 0x161b22);
        gridHelper.position.y = 0.01;
        scene.add(gridHelper);

        // Immersive Dungeon-Wände
        const wallMat = new THREE.MeshStandardMaterial({ color: 0x161b22, roughness: 0.8 });
        
        const backWall = new THREE.Mesh(new THREE.BoxGeometry(12, 6, 0.6), wallMat);
        backWall.position.set(0, 3, -6);
        scene.add(backWall);

        const leftWall = new THREE.Mesh(new THREE.BoxGeometry(0.6, 6, 12), wallMat);
        leftWall.position.set(-6, 3, 0);
        scene.add(leftWall);

        // --- 3. SPIELFIGUR (Ritter mit Rune) ---
        const playerGroup = new THREE.Group();
        const armorMat = new THREE.MeshStandardMaterial({ color: 0x21262d, metalness: 0.85, roughness: 0.2 });
        
        const torso = new THREE.Mesh(new THREE.BoxGeometry(0.5, 0.7, 0.35), armorMat);
        torso.position.y = 0.55;
        playerGroup.add(torso);

        const head = new THREE.Mesh(new THREE.BoxGeometry(0.35, 0.35, 0.35), armorMat);
        head.position.y = 1.0;
        playerGroup.add(head);

        const visor = new THREE.Mesh(new THREE.BoxGeometry(0.25, 0.06, 0.4), new THREE.MeshBasicMaterial({ color: 0x58a6ff }));
        visor.position.set(0, 1.02, 0);
        playerGroup.add(visor);

        const auraRing = new THREE.Mesh(
            new THREE.RingGeometry(0.5, 0.7, 32),
            new THREE.MeshBasicMaterial({ color: 0x3fb950, side: THREE.DoubleSide, transparent: true, opacity: 0.8 })
        );
        auraRing.rotation.x = -Math.PI / 2;
        auraRing.position.y = 0.02;
        playerGroup.add(auraRing);

        scene.add(playerGroup);

        // --- 4. SCHATZ-TRUHE ---
        const chestGeo = new THREE.BoxGeometry(0.7, 0.5, 0.5);
        const chestMat = new THREE.MeshStandardMaterial({ color: 0x8957e5, roughness: 0.4, metalness: 0.5 });
        const chest = new THREE.Mesh(chestGeo, chestMat);
        chest.position.set(3, 0.25, -3);
        scene.add(chest);

        // --- 5. TOUCH & KLICK STEUERUNG ---
        let stats = { hp: 100, gold: 0, xp: 0 };
        let targetPosition = null;
        const raycaster = new THREE.Raycaster();
        const mouse = new THREE.Vector2();

        renderer.domElement.addEventListener('pointerdown', (e) => {
            const rect = renderer.domElement.getBoundingClientRect();
            mouse.x = ((e.clientX - rect.left) / rect.width) * 2 - 1;
            mouse.y = -((e.clientY - rect.top) / rect.height) * 2 + 1;

            raycaster.setFromCamera(mouse, camera);
            const intersects = raycaster.intersectObject(floor);
            if (intersects.length > 0) {
                targetPosition = intersects[0].point;
                targetPosition.x = Math.max(-5, Math.min(5, targetPosition.x));
                targetPosition.z = Math.max(-5, Math.min(5, targetPosition.z));
            }
        });

        function log(msg) {
            const box = document.getElementById('console');
            box.innerHTML += `> ${msg}<br>`;
            box.scrollTop = box.scrollHeight;
        }

        function updateUI() {
            document.getElementById('hp').innerText = stats.hp;
            document.getElementById('gold').innerText = stats.gold;
            document.getElementById('xp').innerText = stats.xp;
        }

        // --- 6. RENDER-SCHLEIFE ---
        function animate() {
            requestAnimationFrame(animate);

            let speed = 0.05;
            if (targetPosition) {
                const dir = new THREE.Vector3().subVectors(targetPosition, playerGroup.position);
                if (dir.length() > 0.1) {
                    dir.y = 0;
                    dir.normalize();
                    playerGroup.position.addScaledVector(dir, speed);
                    playerGroup.lookAt(targetPosition.x, playerGroup.position.y, targetPosition.z);
                } else {
                    targetPosition = null;
                }
            }

            auraRing.rotation.z += 0.02;
            fireLight.intensity = 1.8 + Math.sin(Date.now() * 0.005) * 0.4;

            if (playerGroup.position.distanceTo(chest.position) < 0.9) {
                stats.gold += 50;
                stats.xp += 100;
                log("💎 Schatz aus dem Backend-Dungeon eingesammelt! +50 Gold");
                updateUI();
                chest.position.set((Math.random() - 0.5) * 8, 0.25, (Math.random() - 0.5) * 8);
                targetPosition = null;
            }

            renderer.render(scene, camera);
        }

        animate();
    </script>
</body>
</html>
